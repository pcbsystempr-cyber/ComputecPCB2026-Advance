<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>IA COMPUTEC</title>
    <meta name="description" content="Asistente oficial de COMPUTEC para cursos, admisión, servicios y orientación tecnológica.">
    <link rel="icon" type="image/png" href="galeria/LogoLimpio4.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <style>
        :root {
            --page-bg: radial-gradient(circle at top left, rgba(37, 99, 235, 0.18), transparent 32%),
                       radial-gradient(circle at top right, rgba(6, 182, 212, 0.16), transparent 28%),
                       linear-gradient(180deg, #e0f2fe 0%, #f8fafc 40%, #eef2ff 100%);
        }

        body {
            min-height: 100vh;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            color: var(--text-dark);
            background: var(--page-bg);
        }

        .ai-page {
            min-height: 100vh;
            padding: 14px;
        }

        .ai-page-shell {
            width: min(1320px, 100%);
            margin: 0 auto;
        }

        .ai-page-header {
            /* override global header { position: fixed } from styles.css */
            position: relative !important;
            top: auto !important;
            left: auto !important;
            right: auto !important;
            width: auto !important;
            z-index: auto !important;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: nowrap;
            gap: 10px;
            margin-bottom: 10px;
            padding: 8px 14px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.78);
            border: 1px solid rgba(148, 163, 184, 0.22);
            backdrop-filter: blur(18px);
            box-shadow: 0 4px 16px rgba(15, 23, 42, 0.08);
        }

        .ai-page-copy {
            display: flex;
            align-items: center;
            gap: 9px;
            min-width: 0;
        }

        .ai-page-icon {
            width: 32px;
            height: 32px;
            border-radius: 10px;
            display: grid;
            place-items: center;
            color: #fff;
            background: var(--gradient);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.28);
            flex: 0 0 auto;
            font-size: 0.85rem;
        }

        .ai-page-copy h1 {
            margin: 0;
            font-size: 0.92rem;
            font-weight: 700;
            white-space: nowrap;
        }

        /* hide description to save space */
        .ai-page-copy p {
            display: none;
        }

        .ai-page-actions {
            display: flex;
            gap: 6px;
            flex-shrink: 0;
        }

        .ai-page-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            padding: 6px 11px;
            border-radius: 999px;
            font-weight: 600;
            font-size: 0.78rem;
            text-decoration: none;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            white-space: nowrap;
        }

        .ai-page-link:hover {
            transform: translateY(-1px);
        }

        .ai-page-link.primary {
            background: var(--gradient);
            color: #fff;
            box-shadow: 0 6px 16px rgba(37, 99, 235, 0.22);
        }

        .ai-page-link.secondary {
            background: rgba(255, 255, 255, 0.9);
            color: var(--text-dark);
            border: 1px solid rgba(148, 163, 184, 0.25);
        }

        #ai-toggle-btn {
            position: absolute;
            width: 1px;
            height: 1px;
            margin: -1px;
            padding: 0;
            overflow: hidden;
            clip: rect(0 0 0 0);
            border: 0;
        }

        #ai-assistant-root {
            position: static;
            inset: auto;
            pointer-events: auto;
        }

        #ai-assistant-root .ai-panel {
            position: relative;
            right: auto;
            bottom: auto;
            width: 100%;
            height: calc(100vh - 78px);
            min-height: 480px;
            max-height: none;
            margin: 0;
            border-radius: 20px;
            opacity: 1;
            transform: none;
            pointer-events: auto;
            box-shadow: 0 16px 48px rgba(15, 23, 42, 0.14);
        }

        #ai-assistant-root .ai-panel:not(.ai-open) {
            opacity: 1;
            transform: none;
            pointer-events: auto;
        }

        .ai-close-btn {
            display: none;
        }

        /* Fix: global header{} rule also hits .ai-panel-header — restore its gradient + white text */
        .ai-panel-header {
            position: relative !important;
            top: auto !important;
            left: auto !important;
            right: auto !important;
            width: auto !important;
            z-index: auto !important;
            background: linear-gradient(180deg, rgba(255,255,255,0.12) 0%, rgba(255,255,255,0) 60%),
                        var(--gradient) !important;
            color: #fff !important;
            box-shadow: none !important;
        }

        .ai-panel-header h3,
        .ai-panel-sub,
        .ai-panel-sub .ai-status-dot ~ * {
            color: #fff !important;
        }

        .ai-icon-btn {
            color: rgba(255,255,255,0.85) !important;
        }
        .ai-icon-btn:hover {
            background: rgba(255,255,255,0.18) !important;
            color: #fff !important;
        }

        .ai-messages {
            padding: 10px 14px;
            gap: 7px;
        }

        .ai-bubble {
            max-width: min(78%, 780px);
            padding: 8px 11px;
            font-size: 0.86rem;
            line-height: 1.4;
        }

        .ai-chip {
            padding: 4px 10px;
            font-size: 0.74rem;
        }

        .ai-input {
            padding: 8px 12px;
            font-size: 0.86rem;
        }

        .ai-form {
            padding: 8px 10px;
        }

        .ai-panel-header {
            padding: 10px 14px;
        }

        .ai-panel-header h3 {
            font-size: 0.95rem;
        }

        @media (max-width: 560px) {
            .ai-page {
                padding: 8px;
            }

            .ai-page-link span { display: none; } /* sólo íconos en móvil */
            .ai-page-link { padding: 6px 9px; }

            #ai-assistant-root .ai-panel {
                min-height: 0;
                height: calc(100vh - 72px);
                border-radius: 14px;
            }
        }

        /* ── Dark mode overrides for ai.html page shell ── */
        body.dark-mode {
            --page-bg: #0f172a;
            background: #0f172a;
            color: #f1f5f9;
        }

        body.dark-mode .ai-page-header {
            background: rgba(30, 41, 59, 0.92);
            border-color: rgba(71, 85, 105, 0.35);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
        }

        body.dark-mode .ai-page-copy h1 {
            color: #f1f5f9;
        }

        body.dark-mode .ai-page-copy p {
            color: #94a3b8;
        }

        body.dark-mode .ai-page-link.secondary {
            background: rgba(30, 41, 59, 0.9);
            color: #e2e8f0;
            border-color: rgba(71, 85, 105, 0.4);
        }

        /* Toggle button */
        #ai-theme-toggle {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 10px 15px;
            border-radius: 999px;
            font-weight: 600;
            font-size: 0.875rem;
            cursor: pointer;
            border: 1px solid rgba(148, 163, 184, 0.28);
            background: rgba(255, 255, 255, 0.88);
            color: var(--text-dark);
            transition: background 0.2s, color 0.2s, border-color 0.2s;
        }

        body.dark-mode #ai-theme-toggle {
            background: rgba(30, 41, 59, 0.9);
            color: #e2e8f0;
            border-color: rgba(71, 85, 105, 0.4);
        }

        #ai-theme-toggle:hover {
            transform: translateY(-1px);
        }
    </style>
</head>
<body>
    <div class="ai-page">
        <div class="ai-page-shell">
            <header class="ai-page-header">
                <div class="ai-page-copy">
                    <div class="ai-page-icon"><i class="fa-solid fa-robot"></i></div>
                    <div>
                        <h1>IA COMPUTEC</h1>
                        <p>Asistente oficial para cursos, admisión, servicios técnicos, proyectos y orientación escolar.</p>
                    </div>
                </div>
                <div class="ai-page-actions">
                    <button id="ai-theme-toggle" type="button" aria-label="Cambiar tema">
                        <i class="fa-solid fa-moon"></i><span>Oscuro</span>
                    </button>
                    <a class="ai-page-link secondary" href="index.html"><i class="fa-solid fa-arrow-left"></i> Volver al sitio</a>
                    <a class="ai-page-link primary" href="mailto:de167766@miescuela.pr"><i class="fa-solid fa-envelope"></i> Contactar escuela</a>
                </div>
            </header>

            <button id="ai-toggle-btn" type="button" aria-expanded="true" aria-hidden="true" tabindex="-1">
                <span class="ai-badge" hidden>0</span>
            </button>

            <div id="ai-assistant-root">
                <section class="ai-panel ai-open" aria-hidden="false">
                    <header class="ai-panel-header">
                        <div class="ai-panel-title-wrap">
                            <div class="ai-panel-avatar"><i class="fa-solid fa-robot"></i></div>
                            <div>
                                <h3>IA COMPUTEC</h3>
                                <p class="ai-panel-sub"><span class="ai-status-dot"></span> En línea</p>
                            </div>
                        </div>
                        <div class="ai-panel-actions">
                            <button type="button" class="ai-icon-btn ai-clear-btn" title="Limpiar conversación" aria-label="Limpiar conversación">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                            <button type="button" class="ai-icon-btn ai-close-btn" title="Cerrar" aria-label="Cerrar">
                                <i class="fa-solid fa-xmark"></i>
                            </button>
                        </div>
                    </header>

                    <div class="ai-messages" aria-live="polite"></div>
                    <div class="ai-chips"></div>

                    <form class="ai-form">
                        <input class="ai-input" type="text" placeholder="Escribe tu pregunta sobre COMPUTEC..." autocomplete="off">
                        <button class="ai-send-btn" type="submit" aria-label="Enviar mensaje">
                            <i class="fa-solid fa-paper-plane"></i>
                        </button>
                    </form>

                    <p class="ai-footer-note">
                        La IA puede apoyarte con información general. Si necesitas ayuda oficial, escribe a
                        <a class="ai-link-btn" href="mailto:de167766@miescuela.pr">de167766@miescuela.pr</a>.
                    </p>
                </section>
            </div>
        </div>
    </div>

    <script src="ai-assistant.js"></script>
    <script>
        // ── Theme init ──
        (function () {
            var saved = localStorage.getItem('theme');
            if (saved === 'dark') document.body.classList.add('dark-mode');
        })();

        function syncThemeToggle() {
            var isDark = document.body.classList.contains('dark-mode');
            var btn    = document.getElementById('ai-theme-toggle');
            if (!btn) return;
            btn.querySelector('i').className = isDark ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
            btn.querySelector('span').textContent = isDark ? 'Claro' : 'Oscuro';
        }

        document.addEventListener('DOMContentLoaded', function () {
            syncThemeToggle();

            document.getElementById('ai-theme-toggle').addEventListener('click', function () {
                document.body.classList.toggle('dark-mode');
                var isDark = document.body.classList.contains('dark-mode');
                localStorage.setItem('theme', isDark ? 'dark' : 'light');
                syncThemeToggle();
            });
        });

        window.addEventListener('load', function () {
            if (window.AIComputec && typeof window.AIComputec.open === 'function') {
                window.AIComputec.open();
            }
        });

        // Borrar historial al salir de la página de IA
        window.addEventListener('beforeunload', function () {
            localStorage.removeItem('aiComputecHistory');
        });
    </script>
</body>
</html>
